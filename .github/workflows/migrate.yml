name: migrate

# DB の migration を Supabase に流す（schema の変更だけ。Auth の設定・掲示場の取り込み・参加コードは手で行う）。
# - develop に push → 確認用（staging）に流す
# - main への PR → 流す migration を一覧にし、承認されたら本番（production）に流す。流してから PR をマージする
#   （DB が先、アプリが後。migration は足すだけにして、古いアプリでも動くようにする）
# 接続先は GitHub の Environment ごとの secret SUPABASE_DB_URL（Session pooler の接続文字列）。
# 取り違えを防ぐため、同じ Environment の変数 SUPABASE_PROJECT_REF が接続文字列に入っているかを確かめる。
on:
  push:
    branches: [develop]
    paths: ["supabase/migrations/**"]
  pull_request:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: 流す先
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

jobs:
  # 秘密情報を使わない。流す migration を一覧にし、すでにある migration の書き換えを止める
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: migration を確かめる
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: |
          {
            echo "## 流す migration"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            echo "origin/$BASE_REF がまだないので、すべての migration が対象です。" >> "$GITHUB_STEP_SUMMARY"
            ls supabase/migrations | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "origin/$BASE_REF...HEAD" -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "すでにある migration が書き換えられています。新しい migration を足して直してください:" >&2
            echo "$changed" >&2
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- supabase/migrations | sort)
          if [ -z "$added" ]; then
            echo "$BASE_REF からの新しい migration はありません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$added" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          # 本番より古い日時の migration は db push が断るので、ここで先に止める
          latest_base=$(git ls-tree --name-only "origin/$BASE_REF" supabase/migrations/ | sed 's#.*/##' | sort | tail -n1)
          oldest_added=$(echo "$added" | sed 's#.*/##' | head -n1)
          if [ -n "$latest_base" ] && [[ "$oldest_added" < "$latest_base" ]]; then
            echo "$oldest_added は $BASE_REF の最新（$latest_base）より古い日時です。ファイル名の日時を新しくしてください。" >&2
            exit 1
          fi

  staging:
    needs: plan
    if: github.event_name == 'push' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - name: 接続先を確かめる
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Environment staging の SUPABASE_DB_URL と SUPABASE_PROJECT_REF を設定してください" >&2
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"postgres.$SUPABASE_PROJECT_REF:"*) ;;
            *) echo "SUPABASE_DB_URL が staging のプロジェクト（$SUPABASE_PROJECT_REF）の Session pooler を指していません" >&2; exit 1 ;;
          esac
      - name: 流す前の確認（dry-run）
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: 流す
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

  # Environment production に承認者（required reviewers）を設定し、承認されるまで動かないようにする。
  # 手で流すとき（workflow_dispatch）は main からだけ
  production:
    needs: plan
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - name: 接続先を確かめる
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Environment production の SUPABASE_DB_URL と SUPABASE_PROJECT_REF を設定してください" >&2
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"postgres.$SUPABASE_PROJECT_REF:"*) ;;
            *) echo "SUPABASE_DB_URL が production のプロジェクト（$SUPABASE_PROJECT_REF）の Session pooler を指していません" >&2; exit 1 ;;
          esac
      - name: 流す前の確認（dry-run）
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: 流す
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
